name: interview-teleprompter
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env}
      POSTGRES_DB: ${POSTGRES_DB:?Configure .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    profiles: ['full']
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN:-}
      MCP_READ_ONLY_TOKEN: ${MCP_READ_ONLY_TOKEN:-}
      MCP_PROJECT_IDS: ${MCP_PROJECT_IDS:-}
    ports:
      - '127.0.0.1:8765:3000'
    depends_on:
      db:
        condition: service_healthy
    init: true
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
volumes:
  postgres_data:
